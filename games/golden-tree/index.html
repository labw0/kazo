<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Golden Tree - Kazo</title><link rel="stylesheet" href="style.css"></head><body><main class="game"><header><div><b>GOLDEN</b><strong>TREE</strong></div><span class="demo">DEMO</span></header><section class="stats"><div><small>الرصيد</small><b id="balance">10,000</b></div><div><small>الرهان</small><b id="betLabel">50</b></div><div><small>آخر ربح</small><b id="lastWin">0</b></div></section><section class="machine"><div class="title">🌳 <span>GOLDEN TREE</span></div><div id="bonus" class="bonus hidden">BONUS <b id="bonusText"></b></div><div id="reels" class="reels"></div><div id="message" class="message">اضغط تدوير للبدء</div></section><div class="bets" id="bets"><button data-bet="10">10</button><button data-bet="25">25</button><button data-bet="50" class="active">50</button><button data-bet="100">100</button><button data-bet="250">250</button></div><section class="controls"><button id="bonusBuy" class="buy">شراء BONUS<small>×50 الرهان</small></button><button id="spin" class="spin">↻<small>تدوير</small></button><button id="turbo">⚡<small>سريع</small></button><button id="reset">↺<small>إعادة الرصيد</small></button></section><p class="local">KAZO • LOCAL DEMO ENGINE</p></main><script src="game.js"></script></body></html>
