<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Uncrossable Rush</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;font-family:Arial,sans-serif;color:#fff}.game{height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#06112a 0 11%,#080b1d 11%)}.top{height:10%;min-height:62px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#071631;border-bottom:1px solid #15264d}.brand{font-weight:900;font-size:clamp(18px,5vw,30px);direction:ltr}.brand b{color:#59cfff}.bal{text-align:right;font-size:12px}.bal strong{display:block;font-size:17px}.stage{position:relative;flex:1;overflow:hidden;direction:ltr;background:linear-gradient(90deg,#11182c 0 17%,#090d20 17% 100%)}canvas{width:100%;height:100%;display:block}.diff{position:absolute;right:8%;bottom:22%;background:#20254fdd;border-radius:4px;padding:9px 28px;font-weight:800;font-size:12px}.toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);padding:9px 15px;border-radius:18px;background:#0b1935dd;border:1px solid #435987;font-weight:800;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.controls{height:22%;min-height:150px;background:linear-gradient(#050712,#02030a);display:grid;grid-template-columns:1fr 1.05fr 1fr;align-items:center;padding:6px 12px 12px;gap:8px;direction:ltr}.box{text-align:center;font-size:12px;color:#c8cbe0}.box b{display:block;color:#fff;font-size:15px;margin:5px}.round{width:min(20vw,82px);aspect-ratio:1;border:0;border-radius:50%;font-size:34px;font-weight:900;color:#fff;box-shadow:0 0 0 8px #0c142b}.bet{background:#26305e}.collect{background:#8a3c00}.go{width:min(28vw,112px);aspect-ratio:1;border-radius:50%;border:10px solid #075d22;background:#0cbd38;color:#d7ffdd;font-size:44px;font-weight:900;box-shadow:0 0 20px #00d43d44}.go:active{transform:scale(.94)}.amount{font-size:12px;color:#fff}.back{position:absolute;left:12px;bottom:8px;background:#1a2046;color:#fff;border:0;border-radius:7px;padding:8px 12px;font-size:18px}@media(min-width:700px){.game{max-width:560px;margin:auto;border-left:1px solid #1d2d50;border-right:1px solid #1d2d50}}
</style></head><body><div class="game"><header class="top"><div class="brand"><b>⚡</b>KAZO</div><div class="bal">الرصيد التجريبي<strong id="balance">100,000 د.ع</strong></div></header><main class="stage"><canvas id="c"></canvas><div class="diff">EASY⌃</div><div class="toast" id="toast"></div><button class="back" onclick="history.back()">↩</button></main><footer class="controls"><div class="box"><button class="round bet" id="betBtn">⚙</button><b>BETTING</b><span class="amount">BET <span id="bet">100</span></span></div><div class="box"><button class="go" id="go">➜</button><b id="action">GO</b></div><div class="box"><button class="round collect" id="collect">🪙</button><b>COLLECT</b><span class="amount">BALANCE</span></div></footer></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),go=document.getElementById('go'),collect=document.getElementById('collect'),toast=document.getElementById('toast');let W,H,dpr,step=0,playing=false,jumping=false,dead=false,balance=100000,bet=100,cam=0,t=0,last=0,cars=[],barriers=[];const mult=[1.1,1.2,1.35,1.6,1.8,2.2,2.8,3.5,4.5,6,8,12];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let ac;function tone(f=440,d=.08,type='sine',v=.08){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}function crossSound(){tone(520,.07,'square',.035);setTimeout(()=>tone(690,.08,'sine',.04),70)}function crashSound(){tone(95,.28,'sawtooth',.12);setTimeout(()=>tone(55,.35,'square',.07),60)}
function roadX(i){return W*.28+i*W*.22-cam}function chickenPos(){let p=jumping?jumpP:0;return {x:roadX(step)+p*W*.22,y:H*.64-Math.sin(p*Math.PI)*28}}
function spawn(){let lane=Math.floor(Math.random()*7);cars.push({lane,y:-80-Math.random()*H*.3,s:180+Math.random()*100,w:42+Math.random()*9,h:75+Math.random()*15,col:['#e9edf4','#e4ad20','#cf3138','#2375aa'][Math.floor(Math.random()*4)]})}for(let i=0;i<5;i++){spawn();cars[i].y=Math.random()*H}
function carDraw(a){let px=roadX(a.lane+.45);x.save();x.translate(px,a.y);x.fillStyle='rgba(255,245,180,.12)';x.beginPath();x.moveTo(-a.w*.35,a.h*.35);x.lineTo(-a.w*.7,a.h);x.lineTo(a.w*.7,a.h);x.lineTo(a.w*.35,a.h*.35);x.fill();x.fillStyle=a.col;x.strokeStyle='#101525';x.lineWidth=3;x.beginPath();x.roundRect(-a.w/2,-a.h/2,a.w,a.h,10);x.fill();x.stroke();x.fillStyle='#163143';x.beginPath();x.roundRect(-a.w*.35,-a.h*.2,a.w*.7,a.h*.3,6);x.fill();x.fillStyle='#fff6c8';x.fillRect(-a.w*.32,a.h*.38,8,4);x.fillRect(a.w*.18,a.h*.38,8,4);x.restore()}
function chicken(px,py){let flap=(jumping?Math.sin(jumpP*Math.PI*7):Math.sin(t*7))*.8;x.save();x.translate(px,py);if(dead)x.rotate(Math.min(1.5,(t-deadAt)*5));x.scale(Math.max(.72,W/430),Math.max(.72,W/430));x.fillStyle='#ff9f1c';x.fillRect(-8,16,5,10);x.fillRect(7,16,5,10);x.fillStyle='#f5f2ef';x.beginPath();x.ellipse(0,2,22,26,0,0,Math.PI*2);x.fill();x.save();x.translate(-13,2);x.rotate(flap);x.fillStyle='#ded8d5';x.beginPath();x.ellipse(-8,3,15,8,-.25,0,Math.PI*2);x.fill();x.restore();x.fillStyle='#f8f5f1';x.beginPath();x.arc(7,-20,16,0,Math.PI*2);x.fill();x.fillStyle='#e52b36';for(let i=0;i<3;i++){x.beginPath();x.arc(-2+i*7,-37-(i%2)*3,7,0,Math.PI*2);x.fill()}x.fillStyle='#ffae20';x.beginPath();x.moveTo(20,-20);x.lineTo(34,-14);x.lineTo(20,-10);x.fill();x.fillStyle='#111';x.beginPath();x.arc(12,-23,2.8,0,Math.PI*2);x.fill();x.restore()}
function barrier(b){let px=roadX(b);x.fillStyle='#68718a';x.fillRect(px-20,H*.76,40,8);x.fillStyle='#222b42';for(let i=-16;i<18;i+=12)x.fillRect(px+i,H*.75,6,10)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#10172a';x.fillRect(0,0,W*.18,H);x.fillStyle='#090d20';x.fillRect(W*.18,0,W,H);for(let i=0;i<8;i++){let px=roadX(i);x.strokeStyle='#596077';x.lineWidth=2;x.setLineDash([13,16]);x.beginPath();x.moveTo(px+W*.11,0);x.lineTo(px+W*.11,H);x.stroke();x.setLineDash([]);let m=mult[Math.min(i,mult.length-1)];x.fillStyle='#1a2241';x.strokeStyle='#45527c';x.lineWidth=3;x.beginPath();x.arc(px,H*.54,25,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('x'+m,px,H*.54+5)}barriers.forEach(barrier);cars.forEach(carDraw);let p=chickenPos();chicken(p.x,p.y)}
let jumpP=0,deadAt=0;function loop(now){let dt=Math.min(.033,(now-last)/1000||.016);last=now;t+=dt;for(let a of cars)a.y+=a.s*dt;cars=cars.filter(a=>a.y<H+100);if(Math.random()<dt*2.2)spawn();if(jumping){jumpP+=dt/0.52;let p=chickenPos();for(let a of cars){let ax=roadX(a.lane+.45);if(Math.abs(ax-p.x)<28&&Math.abs(a.y-p.y)<52){jumping=false;dead=true;deadAt=t;playing=false;crashSound();show('اصطدام! خسرت الرهان');setTimeout(reset,1300);break}}if(jumpP>=1&&!dead){jumping=false;step++;barriers.push(step-.55);crossSound();show('عبور ناجح ×'+mult[step-1]);if(step>=mult.length){collectWin()}}}cam+=(Math.max(0,step-1)*W*.22-cam)*dt*3;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function show(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),800)}function reset(){step=0;cam=0;barriers=[];dead=false;jumping=false;playing=false;go.disabled=false;document.getElementById('action').textContent='GO'}function start(){if(balance<bet){show('الرصيد غير كافٍ');return}balance-=bet;upd();playing=true;step=0;barriers=[];document.getElementById('action').textContent='اعبر';tone(300,.08,'sine',.05);hop()}function hop(){if(!playing||jumping||dead)return;jumpP=0;jumping=true;tone(220,.06,'square',.025)}go.onclick=()=>playing?hop():start();function collectWin(){let win=Math.floor(bet*mult[Math.max(0,step-1)]);balance+=win;upd();playing=false;show('تم التحصيل '+win+' د.ع');tone(880,.18,'sine',.07);setTimeout(reset,800)}collect.onclick=()=>{if(playing&&step>0)collectWin()};document.getElementById('betBtn').onclick=()=>{if(playing)return;bet=bet===100?500:bet===500?1000:100;document.getElementById('bet').textContent=bet};function upd(){document.getElementById('balance').textContent=balance.toLocaleString('ar-IQ')+' د.ع'}upd();
</script></body></html>
